const icsEscape = (text) =>
  text.replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

// RFC 5545: lines longer than 75 bytes are folded with CRLF + one space.
function icsFold(line) {
  const bytes = new TextEncoder();
  const parts = [];
  let current = '';
  for (const char of line) {
    const limit = parts.length === 0 ? 75 : 74;
    if (bytes.encode(current + char).length > limit) {
      parts.push(current);
      current = char;
    } else {
      current += char;
    }
  }
  parts.push(current);
  return parts.join('\r\n ');
}

function buildIcs() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Le Club des Alpes//Invitation//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:le-club-des-alpes-vol30-20261212@club-des-alpes',
    `DTSTAMP:${stamp}`,
    `DTSTART:${EVENT.startUtc}`,
    `DTEND:${EVENT.endUtc}`,
    `SUMMARY:${icsEscape(EVENT.title)}`,
    `LOCATION:${icsEscape(EVENT.location)}`,
    `DESCRIPTION:${icsEscape(EVENT.description)}`,
    `URL:${MAPS_URL}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    `DESCRIPTION:${icsEscape(EVENT.title)}`,
    'TRIGGER:-P1D',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ]
    .map(icsFold)
    .join('\r\n');
}

// The Google Calendar apps (iPhone + Android) claim calendar.google.com links, open,
// and on phones often drop the pre-filled event. So each platform gets its own route:
//  · iPhone/iPad: www.google.com isn't claimed by the app → Safari opens Google's
//    web editor with the event filled in (Google redirects to calendar.google.com).
//  · Android (Chrome): hand the link explicitly to the Calendar app via an intent,
//    with the web editor as fallback if the app isn't installed.
//  · Desktop and everything else: unchanged.
const UA = navigator.userAgent;
const IS_IOS_DEVICE =
  /iPad|iPhone|iPod/.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const IS_ANDROID_DEVICE = /Android/i.test(UA);
const IS_ANDROID_WEBVIEW = IS_ANDROID_DEVICE && /; wv\)/.test(UA);
const GOOGLE_CALENDAR_WEB_URL = GOOGLE_CALENDAR_URL.replace(
  'https://calendar.google.com/',
  'https://www.google.com/'
);

function googleCalendarLink() {
  if (IS_IOS_DEVICE) return { href: GOOGLE_CALENDAR_WEB_URL, newTab: true };
  if (IS_ANDROID_DEVICE && !IS_ANDROID_WEBVIEW) {
    return {
      href:
        `intent://${GOOGLE_CALENDAR_URL.slice('https://'.length)}` +
        '#Intent;scheme=https;package=com.google.android.calendar;' +
        `S.browser_fallback_url=${encodeURIComponent(GOOGLE_CALENDAR_WEB_URL)};end`,
      newTab: false,
    };
  }
  return { href: GOOGLE_CALENDAR_URL, newTab: true };
}

/* ─────────────────────── Easter Egg 1: Die 30er-Eskalation ───────────────── */

function Intro({ onDone }) {
  const [count, setCount] = useState(1);
  const [landed, setLanded] = useState(false);
  const shake = useAnimationControls();

  // 1 → 29 at full speed, braking hard over the last few numbers, then 30.
  useEffect(() => {
    let n = 1;
    let timer;
    const tick = () => {
      n += 1;
      setCount(n);
      if (n >= 30) {
        setLanded(true);
        return;
      }
      const delay = n < 22 ? 38 : 38 + (n - 21) * 26;
      timer = setTimeout(tick, delay);
    };
    timer = setTimeout(tick, 350);
    return () => clearTimeout(timer);
  }, []);

  useEffect(() => {
    if (!landed) return undefined;
    try { navigator.vibrate?.([60, 40, 120]); } catch { /* not supported */ }
    shake.start({
      x: [0, -28, 24, -18, 14, -8, 4, 0],
      y: [0, 14, -12, 8, -6, 3, 0],
      rotate: [0, -2, 2, -1, 1, 0],
      transition: { duration: 0.6, ease: 'easeOut' },
    });
    const timer = setTimeout(onDone, 1900);
    return () => clearTimeout(timer);
  }, [landed, onDone, shake]);

  return (
    <motion.div
      className="fixed inset-0 z-50 flex cursor-pointer flex-col items-center justify-center overflow-hidden bg-[#0d0221]"
      onClick={onDone}
      exit={{ opacity: 0, scale: 1.4, filter: 'blur(12px)', transition: { duration: 0.5 } }}

      <motion.div animate={shake} className="relative flex flex-col items-center">

function readStoredRsvp(name) {
  const raw = storage.get(RSVP_STORAGE_KEY);
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    return parsed && parsed.name === name && parsed.status ? parsed : null;
  } catch {
    return null;
  }
}

function Rsvp({ name }) {
  // Remembers this device's last answer for this guest, so a returning guest sees it's saved.
  const stored = useMemo(() => readStoredRsvp(name), [name]);
  // idle → confirming → confirmed   |   idle → declining → declined
  const [phase, setPhase] = useState(stored ? stored.status : 'idle');
  const [savedAt, setSavedAt] = useState(stored?.at ?? null);
  const [error, setError] = useState('');
  const busy = phase === 'confirming' || phase === 'declining';

  const respond = async (status) => {
    if (busy) return;
    setError('');
    setPhase(status === 'confirmed' ? 'confirming' : 'declining');
    try {
      await Promise.all([saveRsvp(name, status), wait(MIN_LOADING_MS)]);
      const at = new Date().toISOString();
      storage.set(RSVP_STORAGE_KEY, JSON.stringify({ name, status, at }));
      setSavedAt(at);
      setPhase(status);
    } catch (err) {
      console.error('[RSVP]', err);
      setPhase('idle');
      setError('Mist, die Verbindung hat gezickt – deine Antwort ist noch nicht gespeichert. Bitte nochmal drücken.');
    }
  };

  const reset = () => {
    storage.remove(RSVP_STORAGE_KEY);
    setPhase('idle');
  };

  return (
    <section id="rsvp" className="scroll-mt-6 px-5 py-10">
      <SectionTitle kicker={`RSVP · BIS ${RSVP_DEADLINE}`} color="var(--cyan)">
        Bist du dabei, {name}?
      </SectionTitle>

      <AnimatePresence mode="wait" initial={false}>
        {phase === 'confirmed' ? (
          <Confirmed key="confirmed" name={name} savedAt={savedAt} onChange={reset} />
        ) : phase === 'declined' ? (
          <Declined key="declined" name={name} onChange={reset} />
        ) : (
          <motion.div
            key="ask"
            className="chunky bg-[#1a0838] p-5"
            exit={{ opacity: 0, scale: 0.95, transition: { duration: 0.25 } }}
          >
            <p className="font-body text-lg font-medium leading-snug text-white/90">
              Sag mir bitte bis zum <strong className="text-[var(--yellow)]">{RSVP_DEADLINE}</strong>{' '}
              Bescheid. Ein Klick reicht.
            </p>

            <button
              type="button"
              onClick={() => respond('confirmed')}
              disabled={busy}
              aria-busy={phase === 'confirming'}
              className="chunky font-display mt-5 flex min-h-16 w-full items-center justify-center gap-3 bg-[var(--pink)] px-4 text-xl text-white disabled:cursor-wait"
            >
              {phase === 'confirming' ? (
                <>
                  <Loader2 className="h-6 w-6 animate-spin" strokeWidth={2.5} />
                  Speichere…
                </>
              ) : (
                <>ICH BIN DABEI! 🎉</>
              )}
            </button>

            <button
              type="button"
              onClick={() => respond('declined')}
              disabled={busy}
              className="font-body mx-auto mt-3 flex min-h-12 items-center gap-2 px-4 text-sm text-white/65 underline underline-offset-4 disabled:opacity-50"
            >
              {phase === 'declining' ? (
                <>
                  <Loader2 className="h-4 w-4 animate-spin" /> Speichere Absage…
                </>
              ) : (
                'Kann leider nicht 😢'
              )}
            </button>

            <div aria-live="polite">
              {error && (
                <p role="alert" className="font-body mt-3 bg-[var(--pink)] px-3 py-2 text-sm font-bold text-white">
                  {error}
                </p>
              )}
            </div>
          </motion.div>
        )}
      </AnimatePresence>
    </section>
  );
}

/* ───────────── Easter Egg 2: Das Frost-Rubbellos (leibliches Wohl) ───────── */

function FrostScratch() {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);
  const strokes = useRef(0);
  const touched = useRef(false);
  const [revealed, setRevealed] = useState(false);

  const paintFrost = useCallback(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const { width, height } = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    const ice = ctx.createLinearGradient(0, 0, width, height);
    ice.addColorStop(0, '#dbe6f0');
    ice.addColorStop(0.45, '#a9bccf');
    ice.addColorStop(1, '#e8f0f7');
    ctx.fillStyle = ice;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 700; i += 1) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.6})`;
      ctx.fillRect(Math.random() * width, Math.random() * height, 1.6, 1.6);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 9; i += 1) {
      let x = Math.random() * width;
      let y = Math.random() * height;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let j = 0; j < 5; j += 1) {
        x += Math.random() * 60 - 30;
        y += Math.random() * 40 - 20;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    ctx.fillStyle = '#334155';
    ctx.textAlign = 'center';
    ctx.font = `${Math.min(22, width / 14)}px Bungee, 'Arial Black', sans-serif`;
    ctx.fillText('❄ HIER RUBBELN ❄', width / 2, height / 2 - 4);
    ctx.font = "600 13px 'Space Grotesk', sans-serif";
    ctx.fillText('mit Finger oder Maus übers Eis', width / 2, height / 2 + 20);
  }, []);

  useEffect(() => {
    paintFrost();
    // Repaint once the fonts are in, unless someone already started scratching.
    document.fonts?.ready?.then(() => {
      if (!touched.current) paintFrost();
    });
    const onResize = () => {
      if (!touched.current) paintFrost();
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [paintFrost]);

  const checkProgress = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clear = 0;
    let total = 0;
    for (let i = 3; i < data.length; i += 4 * 24) {
      total += 1;
      if (data[i] === 0) clear += 1;
    }
    if (clear / total > 0.5) setRevealed(true);
  };

  const scratchAt = (event) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 42;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.current?.x ?? x, last.current?.y ?? y);
    ctx.lineTo(x + 0.01, y);
    ctx.stroke();
    last.current = { x, y };
    touched.current = true;
    strokes.current += 1;
    if (strokes.current % 10 === 0) checkProgress();
  };

  return (
    <section className="px-5 py-8">
      <SectionTitle kicker="RUBBELLOS · VERPFLEGUNG" color="var(--yellow)">
        Wie ist es um mein leibliches Wohl bestellt?
      </SectionTitle>

      <div ref={wrapRef} className="chunky relative min-h-44 overflow-hidden bg-[var(--pink)]">
        <div className="flex min-h-44 flex-col items-center justify-center gap-3 p-6 text-center">
          <p className="font-display text-xl leading-snug text-white">
            Keine Sorge: Es gibt genug zu essen, noch mehr zu saufen und draußen brennt die
            Feuerschale!
          </p>
          <p className="text-3xl" aria-hidden="true">🍖 🍻 🔥</p>
        </div>

        <motion.canvas
          ref={canvasRef}
          aria-hidden="true"
          className="absolute inset-0 h-full w-full cursor-crosshair touch-none"
          animate={{ opacity: revealed ? 0 : 1 }}
          transition={{ duration: 0.6 }}
          style={{ pointerEvents: revealed ? 'none' : 'auto' }}
          onPointerDown={(e) => {
            drawing.current = true;
            e.currentTarget.setPointerCapture?.(e.pointerId);
            scratchAt(e);
          }}
          onPointerMove={(e) => {
            // Mouse scratches on hover; finger and pen scratch while pressed.
            if (e.pointerType === 'mouse' || drawing.current) scratchAt(e);
          }}
          onPointerUp={() => {
            drawing.current = false;
            last.current = null;
            checkProgress();
          }}
          onPointerLeave={() => {
            drawing.current = false;
            last.current = null;
          }}
        />
      </div>

      {!revealed && (
        <button
          type="button"
          onClick={() => setRevealed(true)}
          className="font-body mt-3 min-h-12 text-sm text-white/60 underline underline-offset-4"
        >
          Keine Lust zu rubbeln? Direkt aufdecken
        </button>
      )}
    </section>
  );
}

/* ───────────────── Easter Egg 3: Der Outfit-Generator (Slot Machine) ─────── */

const REELS = [
  ['Neon-Skianzug', 'Retro-Anorak', 'Pinke Daunenjacke', 'Onesie von ’96', 'Norweger-Pulli', 'Tennisrock über Skihose'],
  ['Moonboots', 'Après-Ski-Stiefel', 'Thermo-Leggings', 'Kniestrümpfe', 'Schneestiefel', 'Tennissocken in Moonboots'],
  ['Wollmütze', 'Schweißband in Neon', 'Skibrille auf Stirn', 'Bommelmütze', 'Ohrenwärmer', 'Neon-Sonnenbrille'],
];

function Reel({ items, index, spinning }) {
  return (
    <div className="chunky relative flex h-24 flex-1 items-center justify-center overflow-hidden bg-white px-1.5">
      {spinning ? (
        <motion.span
          key="spin"
          className="font-body block text-center text-[13px] font-bold leading-tight tracking-tight text-black/70 blur-[1.5px]"
          animate={{ y: [-14, 14] }}
          transition={{ duration: 0.07, repeat: Infinity, repeatType: 'mirror', ease: 'linear' }}
        >
          {items[index]}
        </motion.span>
      ) : (
        <motion.span
          key={`stop-${index}`}
          className="font-body block hyphens-auto break-words text-center text-[13px] font-bold leading-tight tracking-tight text-black"
          initial={{ y: -30, scale: 1.2 }}
          animate={{ y: 0, scale: 1 }}
          transition={{ type: 'spring', stiffness: 600, damping: 12 }}
        >
          {items[index]}
        </motion.span>
      )}
      <span aria-hidden="true" className="pointer-events-none absolute inset-x-0 top-0 h-5 bg-gradient-to-b from-black/25 to-transparent" />
      <span aria-hidden="true" className="pointer-events-none absolute inset-x-0 bottom-0 h-5 bg-gradient-to-t from-black/25 to-transparent" />
    </div>
  );
}

function OutfitSlot() {
  const [indexes, setIndexes] = useState([0, 0, 0]);
  const [spinning, setSpinning] = useState([false, false, false]);
  const [spun, setSpun] = useState(false);
  const timers = useRef([]);
  const busy = spinning.some(Boolean);

  useEffect(() => () => timers.current.forEach(clearInterval), []);

  const spin = () => {
    if (busy) return;
    setSpun(true);
    setSpinning([true, true, true]);
    REELS.forEach((items, reel) => {
      const interval = setInterval(() => {
        setIndexes((prev) => {
          const next = [...prev];
          next[reel] = (next[reel] + 1) % items.length;
          return next;
        });
      }, 70);
      timers.current.push(interval);
      const stop = setTimeout(() => {
        clearInterval(interval);
        setIndexes((prev) => {
          const next = [...prev];
          next[reel] = Math.floor(Math.random() * items.length);
          return next;
        });
        setSpinning((prev) => {
          const next = [...prev];
          next[reel] = false;
          return next;
        });
      }, 900 + reel * 500);
      timers.current.push(stop);
    });
  };

  return (
    <section className="px-5 py-8">
      <SectionTitle kicker="OUTFIT-AUTOMAT" color="var(--pink)">
        Keine Idee, was du anziehen sollst?
      </SectionTitle>

      <div className="chunky bg-[#1a0838] p-4">
        <div className="flex gap-2">
          {REELS.map((items, reel) => (
            <Reel key={reel} items={items} index={indexes[reel]} spinning={spinning[reel]} />
          ))}
        </div>
        <p className="sr-only" aria-live="polite">
          {spun && !busy ? `Dein Outfit: ${REELS.map((r, i) => r[indexes[i]]).join(', ')}` : ''}
        </p>

        <button
          type="button"
          onClick={spin}
          disabled={busy}
          className="chunky font-display mt-4 flex min-h-14 w-full items-center justify-center gap-3 bg-[var(--cyan)] px-4 text-lg text-black disabled:opacity-80"
        >
          <Dices className={`h-6 w-6 ${busy ? 'animate-spin' : ''}`} strokeWidth={2.2} />
          {busy ? 'Rattert…' : spun ? 'Nochmal drehen!' : 'Dresscode Inspo'}
        </button>
      </div>
    </section>
  );
}

/* ────────────────── Easter Egg 6: Pub-Quiz Sneak Peek (Modal) ────────────── */

const QUIZ = {
  question: 'Mit welchen Ski bin ich die 2025 Saison gefahren?',
  answers: [
    { id: 'a', text: 'Volvic Orange Ski', note: 'sie waren sehr langsam', correct: true },
    { id: 'b', text: 'Paulaner Weißbier Ski', note: 'sie waren sehr steif' },
    { id: 'c', text: 'Ramazzotti Ski', note: 'sie waren sehr kurze Trick-Ski' },
    { id: 'd', text: 'Müller-Thurgau Ski', note: 'sie waren sehr trocken' },
  ],
};

function PubQuiz() {
  const [open, setOpen] = useState(false);
  const [choice, setChoice] = useState(null);
  const closeRef = useRef(null);

  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => e.key === 'Escape' && setOpen(false);
    document.addEventListener('keydown', onKey);
    const { overflow } = document.body.style;
    document.body.style.overflow = 'hidden';
    closeRef.current?.focus();
    return () => {
      document.removeEventListener('keydown', onKey);
      document.body.style.overflow = overflow;
    };
  }, [open]);

  const picked = QUIZ.answers.find((a) => a.id === choice);

  return (
    <section className="px-5 py-8 text-center">
      <SectionTitle kicker="PUB QUIZ · SNEAK PEEK" color="var(--yellow)">
        Bist du quizfit?
      </SectionTitle>

      <motion.button
        type="button"
        onClick={() => {
          setChoice(null);
          setOpen(true);
        }}
        whileHover={{ rotate: -2, scale: 1.03 }}
        className="chunky font-display mx-auto flex min-h-16 w-full items-center justify-center gap-3 bg-[var(--yellow)] px-5 text-xl text-black"
        style={{ boxShadow: '8px 8px 0 #000, 8px 8px 0 3px var(--pink)' }}
      >
        🍺 Testfrage aufdecken
      </motion.button>

      <AnimatePresence>
        {open && (
          <motion.div
            className="fixed inset-0 z-50 flex items-end justify-center bg-black/75 p-4 backdrop-blur-sm sm:items-center"
            initial={{ opacity: 0 }}
            animate={{ opacity: 1 }}
            exit={{ opacity: 0 }}
            onClick={() => setOpen(false)}
          >
            <motion.div
              role="dialog"
              aria-modal="true"
              aria-labelledby="quiz-title"
              className="chunky relative max-h-[92dvh] w-full max-w-md overflow-y-auto bg-[#1a0838] p-5 pt-6 text-left"
              style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 1.25rem)' }}
              initial={{ y: 80, scale: 0.9, rotate: -3 }}
              animate={{ y: 0, scale: 1, rotate: 0 }}
              exit={{ y: 80, opacity: 0 }}
              transition={{ type: 'spring', stiffness: 380, damping: 24 }}
              onClick={(e) => e.stopPropagation()}
            >
              <button
                ref={closeRef}
                type="button"
                onClick={() => setOpen(false)}
                aria-label="Schließen"
                className="absolute right-2 top-2 flex h-12 w-12 items-center justify-center text-white/70"
              >
                <X className="h-6 w-6" />
              </button>

              <p className="font-pixel text-[10px] text-[var(--cyan)]">FRAGE 1 / ???</p>
              <h3 id="quiz-title" className="font-display mt-3 pr-8 text-2xl leading-tight text-white">
                {QUIZ.question}
              </h3>

              <div className="mt-5 grid gap-3">
                {QUIZ.answers.map((a) => {
                  const revealed = Boolean(choice);
                  const isPicked = choice === a.id;
                  let tone = 'bg-white text-black';
                  if (revealed && a.correct) tone = 'bg-[#22c55e] text-black';
                  else if (isPicked) tone = 'bg-[var(--pink)] text-white';
                  return (
                    <motion.button
                      key={a.id}
                      type="button"
                      onClick={() => setChoice(a.id)}
                      whileTap={{ scale: 0.97 }}
                      animate={isPicked && !a.correct ? { x: [0, -8, 8, -4, 0] } : {}}
                      className={`chunky font-body flex min-h-12 items-start gap-3 px-4 py-3 text-left ${tone}`}
                    >
                      <span className="font-display mt-0.5 text-sm uppercase">{a.id})</span>
                      <span>
                        <span className="block text-base font-bold">{a.text}</span>
                        <span className="block text-sm opacity-75">({a.note})</span>
                      </span>
                      {revealed && a.correct && <Check className="ml-auto h-5 w-5 shrink-0" strokeWidth={3} />}
                      {isPicked && !a.correct && <X className="ml-auto h-5 w-5 shrink-0" strokeWidth={3} />}
                    </motion.button>
                  );
                })}
              </div>

              <div className="min-h-24" aria-live="polite">
                <AnimatePresence mode="wait">
                  {picked && (
                    <motion.div
                      key={picked.id}
                      initial={{ opacity: 0, scale: 0.8, rotate: -4 }}
                      animate={{ opacity: 1, scale: 1, rotate: 0 }}
                      exit={{ opacity: 0 }}
                      transition={{ type: 'spring', stiffness: 500, damping: 18 }}
                      className="mt-5"
                    >
                      <p className="font-display text-lg leading-snug text-[var(--yellow)]">
                        {picked.correct
                          ? 'Richtig! 🍊 Langsam, aber mit Stil.'
                          : 'Leider falsch! Ich war auf Volvic Orange Ski unterwegs – sehr langsam, aber mit Stil. 🍊'}
                      </p>
                      <p className="font-body mt-2 text-sm text-white/70">
                        Die echten Fragen gibt’s am 12.12. – und die werden härter.
                      </p>
                    </motion.div>
                  )}
                </AnimatePresence>
              </div>
            </motion.div>
          </motion.div>
        )}
      </AnimatePresence>
    </section>
  );
}

/* ──────────────────────────────── Geschenke ──────────────────────────────── */

function CopyIban() {
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!copied) return undefined;
    const timer = setTimeout(() => setCopied(false), 2200);
    return () => clearTimeout(timer);
  }, [copied]);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(IBAN.replace(/\s/g, ''));
      setCopied(true);
    } catch {
      // Clipboard unavailable (e.g. in-app browser) — the IBAN stays selectable.
    }
  };

  return (
    <button
      type="button"
      onClick={copy}
      className="chunky font-body mt-3 flex min-h-12 w-full items-center justify-between gap-3 bg-white px-3 py-2 text-left text-black"
    >
      <span className="select-text text-[15px] font-bold tabular-nums">{IBAN}</span>
      {copied ? (
        <Check className="h-5 w-5 shrink-0 text-green-600" strokeWidth={3} />
      ) : (
        <Copy className="h-5 w-5 shrink-0" strokeWidth={2.2} />
      )}
      <span className="sr-only" aria-live="polite">{copied ? 'IBAN kopiert' : ''}</span>
    </button>
  );
}

function Gifts() {

/* ──────────────────────────────── Footer ─────────────────────────────────── */

/** In-app browsers (Instagram, WhatsApp…) can misbehave. On iOS 17+ the
 *  x-safari- scheme hands the current URL straight to Safari. */
function Footer() {
  const { href, isIOS } = useMemo(() => {
    const url = window.location.href;
    const ios =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return { href: ios ? `x-safari-${url}` : url, isIOS: ios };
  }, []);

  return (
    <footer className="px-6 pt-6 text-center" style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 2rem)' }}>
      <p className="font-pixel text-[9px] leading-relaxed text-white/40">GAME, SET, 30 · 1996 – 2026</p>
      <a
        href={href}
        {...(!isIOS && { target: '_blank', rel: 'noopener noreferrer' })}
        className="font-body mt-2 inline-flex min-h-12 items-center text-xs text-white/50 underline underline-offset-4"
      >
        Probleme? Hier tippen, um die Seite in Safari zu öffnen.
      </a>
    </footer>
  );
}

/* ───────────────────────────────── App ───────────────────────────────────── */

// Every visit starts from the top: intro → guest check → invitation.
function App() {
  const reduceMotion = useReducedMotion();
  const [stage, setStage] = useState(reduceMotion ? 'gate' : 'intro');
  const [guest, setGuest] = useState(null);

  const endIntro = useCallback(() => setStage((s) => (s === 'intro' ? 'gate' : s)), []);
  const unlock = useCallback((name) => {
    setGuest(name);
    setStage('page');
    window.scrollTo(0, 0);
  }, []);

  return (
    <MotionConfig reducedMotion="user">
      <div className="font-body relative min-h-[100dvh] overflow-x-clip bg-[#0d0221] text-white antialiased selection:bg-[var(--pink)] selection:text-white">
        <Backdrop />
        <Snow />

        <AnimatePresence mode="wait">
          {stage === 'intro' && <Intro key="intro" onDone={endIntro} />}
          {stage === 'gate' && <NameGate key="gate" onUnlock={unlock} />}
          {stage === 'page' && <Invitation key="page" name={guest} />}
        </AnimatePresence>
      </div>
    </MotionConfig>
  );
}

function Invitation({ name }) {
  return (
    <motion.div
      className="relative z-10"
      initial={{ opacity: 0, y: 60 }}
      animate={{ opacity: 1, y: 0 }}
      transition={{ type: 'spring', stiffness: 200, damping: 24 }}
    >
      <Marquee />
      <main className="mx-auto w-full max-w-lg">
        <Hero name={name} />
        <Facts />
        <Rsvp name={name} />

        <BonusDivider />
        <PolaroidGroup items={POLAROIDS_KIDS} />
        <FrostScratch />
        <OutfitSlot />
        <PolaroidGroup items={POLAROIDS_SNOW} />
        <PubQuiz />
        <Gifts />
        <Footer />
      </main>
    </motion.div>
  );
}

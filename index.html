const icsEscape = (text) =>
  text.replace(/\\/g, '\\\\').replace(/;/g, '\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');

// RFC 5545: lines longer than 75 bytes are folded with CRLF + one space.
function icsFold(line) {
  const bytes = new TextEncoder();
  const parts = [];
  let current = '';
  for (const char of line) {
    const limit = parts.length === 0 ? 75 : 74;
    if (bytes.encode(current + char).length > limit) {
      parts.push(current);
      current = char;
    } else {
      current += char;
    }
  }
  parts.push(current);
  return parts.join('\r\n ');
}

function buildIcs() {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return [
    'BEGIN:VCALENDAR',
    'VERSION:2.0',
    'PRODID:-//Le Club des Alpes//Invitation//EN',
    'CALSCALE:GREGORIAN',
    'METHOD:PUBLISH',
    'BEGIN:VEVENT',
    'UID:le-club-des-alpes-vol30-20261212@club-des-alpes',
    `DTSTAMP:${stamp}`,
    `DTSTART:${EVENT.startUtc}`,
    `DTEND:${EVENT.endUtc}`,
    `SUMMARY:${icsEscape(EVENT.title)}`,
    `LOCATION:${icsEscape(EVENT.location)}`,
    `DESCRIPTION:${icsEscape(EVENT.description)}`,
    `URL:${MAPS_URL}`,
    'BEGIN:VALARM',
    'ACTION:DISPLAY',
    `DESCRIPTION:${icsEscape(EVENT.title)}`,
    'TRIGGER:-P1D',
    'END:VALARM',
    'END:VEVENT',
    'END:VCALENDAR',
  ]
    .map(icsFold)
    .join('\r\n');
}

// Blob download — Apple Calendar, Outlook, iOS Safari (13+) and Android all accept it.
function downloadIcs() {

  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ─────────────────────── Easter Egg 1: Die 30er-Eskalation ───────────────── */

function Intro({ onDone }) {
  const [count, setCount] = useState(1);
  const [landed, setLanded] = useState(false);
  const shake = useAnimationControls();

  // 1 → 29 at full speed, braking hard over the last few numbers, then 30.
  useEffect(() => {
    let n = 1;
    let timer;
    const tick = () => {
      n += 1;
      setCount(n);
      if (n >= 30) {
        setLanded(true);
        return;
      }
      const delay = n < 22 ? 38 : 38 + (n - 21) * 26;
      timer = setTimeout(tick, delay);
    };
    timer = setTimeout(tick, 350);
    return () => clearTimeout(timer);
  }, []);

  useEffect(() => {
    if (!landed) return undefined;
    try { navigator.vibrate?.([60, 40, 120]); } catch { /* not supported */ }
    shake.start({
      x: [0, -28, 24, -18, 14, -8, 4, 0],
      y: [0, 14, -12, 8, -6, 3, 0],
      rotate: [0, -2, 2, -1, 1, 0],
      transition: { duration: 0.6, ease: 'easeOut' },
    });
    const timer = setTimeout(onDone, 1700);
    return () => clearTimeout(timer);
  }, [landed, onDone, shake]);

  return (
    <motion.div
      className="fixed inset-0 z-50 flex cursor-pointer flex-col items-center justify-center overflow-hidden bg-[#0d0221]"
      onClick={onDone}
      exit={{ opacity: 0, scale: 1.4, filter: 'blur(12px)', transition: { duration: 0.5 } }}
      role="presentation"
    >
      <Backdrop />
      <AnimatePresence>
        {landed && (
          <motion.div
            key="flash"
            className="absolute inset-0 bg-white"
            initial={{ opacity: 0.95 }}
            animate={{ opacity: 0 }}
            transition={{ duration: 0.45 }}
          />
        )}
      </AnimatePresence>

      <motion.div animate={shake} className="relative flex flex-col items-center">
        <span
          className={`font-display leading-none tabular-nums ${landed ? 'neon-pink' : 'text-white/90'}`}
          style={{ fontSize: 'min(62vw, 60vh)' }}
          aria-live="off"
        >
          {count}
        </span>
        <AnimatePresence>
          {landed && (
            <motion.p
              className="font-display -mt-2 text-center text-2xl text-[var(--yellow)] sm:text-4xl"
              initial={{ opacity: 0, scale: 2.4, rotate: -8 }}
              animate={{ opacity: 1, scale: 1, rotate: -4 }}
              transition={{ type: 'spring', stiffness: 500, damping: 14 }}
            >
              LEOPOLD WIRD 30!

          )}
        </AnimatePresence>

      >
        Überspringen
      </button>
    </motion.div>
  );
}

/* ───────────────── Easter Egg 2: Das Frost-Rubbellos (Verpflegung) ───────── */

function FrostScratch() {
  const wrapRef = useRef(null);
  const canvasRef = useRef(null);
  const drawing = useRef(false);
  const last = useRef(null);
  const strokes = useRef(0);
  const touched = useRef(false);
  const [revealed, setRevealed] = useState(false);

  const paintFrost = useCallback(() => {
    const canvas = canvasRef.current;
    const wrap = wrapRef.current;
    if (!canvas || !wrap) return;
    const { width, height } = wrap.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';

    const ice = ctx.createLinearGradient(0, 0, width, height);
    ice.addColorStop(0, '#dbe6f0');
    ice.addColorStop(0.45, '#a9bccf');
    ice.addColorStop(1, '#e8f0f7');
    ctx.fillStyle = ice;
    ctx.fillRect(0, 0, width, height);

    for (let i = 0; i < 700; i += 1) {
      ctx.fillStyle = `rgba(255,255,255,${Math.random() * 0.6})`;
      ctx.fillRect(Math.random() * width, Math.random() * height, 1.6, 1.6);
    }
    ctx.strokeStyle = 'rgba(255,255,255,.55)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 9; i += 1) {
      let x = Math.random() * width;
      let y = Math.random() * height;
      ctx.beginPath();
      ctx.moveTo(x, y);
      for (let j = 0; j < 5; j += 1) {
        x += Math.random() * 60 - 30;
        y += Math.random() * 40 - 20;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    ctx.fillStyle = '#334155';
    ctx.textAlign = 'center';
    ctx.font = `${Math.min(22, width / 14)}px Bungee, 'Arial Black', sans-serif`;
    ctx.fillText('❄ HIER RUBBELN ❄', width / 2, height / 2 - 4);
    ctx.font = "600 13px 'Space Grotesk', sans-serif";
    ctx.fillText('mit Finger oder Maus übers Eis', width / 2, height / 2 + 20);
  }, []);

  useEffect(() => {
    paintFrost();
    // Repaint once the fonts are in, unless someone already started scratching.
    document.fonts?.ready?.then(() => {
      if (!touched.current) paintFrost();
    });
    const onResize = () => {
      if (!touched.current) paintFrost();
    };
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, [paintFrost]);

  const checkProgress = () => {
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let clear = 0;
    let total = 0;
    for (let i = 3; i < data.length; i += 4 * 24) {
      total += 1;
      if (data[i] === 0) clear += 1;
    }
    if (clear / total > 0.5) setRevealed(true);
  };

  const scratchAt = (event) => {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const x = event.clientX - rect.left;
    const y = event.clientY - rect.top;
    const ctx = canvas.getContext('2d');
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 42;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(last.current?.x ?? x, last.current?.y ?? y);
    ctx.lineTo(x + 0.01, y);
    ctx.stroke();
    last.current = { x, y };
    touched.current = true;
    strokes.current += 1;
    if (strokes.current % 10 === 0) checkProgress();
  };

  return (
    <section className="px-5 py-8">
      <SectionTitle kicker="RUBBELLOS · VERPFLEGUNG" color="var(--yellow)">
        Was gibt’s zu futtern?
      </SectionTitle>

      <div ref={wrapRef} className="chunky relative min-h-44 overflow-hidden bg-[var(--pink)]">
        <div className="flex min-h-44 flex-col items-center justify-center gap-3 p-6 text-center">
          <p className="font-display text-xl leading-snug text-white">
            Keine Sorge: Es gibt genug zu essen, noch mehr zu saufen und draußen brennt die
            Feuerschale!
          </p>
          <p className="text-3xl" aria-hidden="true">🍖 🍻 🔥</p>
        </div>

        <motion.canvas
          ref={canvasRef}
          aria-hidden="true"
          className="absolute inset-0 h-full w-full cursor-crosshair touch-none"
          animate={{ opacity: revealed ? 0 : 1 }}
          transition={{ duration: 0.6 }}
          style={{ pointerEvents: revealed ? 'none' : 'auto' }}
          onPointerDown={(e) => {
            drawing.current = true;
            e.currentTarget.setPointerCapture?.(e.pointerId);
            scratchAt(e);
          }}
          onPointerMove={(e) => {
            // Mouse scratches on hover; finger and pen scratch while pressed.
            if (e.pointerType === 'mouse' || drawing.current) scratchAt(e);
          }}
          onPointerUp={() => {
            drawing.current = false;
            last.current = null;
            checkProgress();
          }}
          onPointerLeave={() => {
            drawing.current = false;
            last.current = null;
          }}
        />
      </div>

      {!revealed && (
        <button
          type="button"
          onClick={() => setRevealed(true)}
          className="font-body mt-3 min-h-12 text-sm text-white/60 underline underline-offset-4"
        >
          Keine Lust zu rubbeln? Direkt aufdecken
        </button>
      )}
    </section>
  );
}

function OutfitSlot() {
  const [indexes, setIndexes] = useState([0, 0, 0]);
  const [spinning, setSpinning] = useState([false, false, false]);
  const [spun, setSpun] = useState(false);
  const timers = useRef([]);
  const busy = spinning.some(Boolean);

  useEffect(() => () => timers.current.forEach(clearInterval), []);

  const spin = () => {
    if (busy) return;
    setSpun(true);
    setSpinning([true, true, true]);
    REELS.forEach((items, reel) => {
      const interval = setInterval(() => {
        setIndexes((prev) => {
          const next = [...prev];
          next[reel] = (next[reel] + 1) % items.length;
          return next;
        });
      }, 70);
      timers.current.push(interval);
      const stop = setTimeout(() => {
        clearInterval(interval);
        setIndexes((prev) => {
          const next = [...prev];
          next[reel] = Math.floor(Math.random() * items.length);
          return next;
        });
        setSpinning((prev) => {
          const next = [...prev];
          next[reel] = false;
          return next;
        });
      }, 900 + reel * 500);
      timers.current.push(stop);
    });
  };

  return (
    <section className="px-5 py-8">
      <SectionTitle kicker="DRESSCODE · ALPINE ELEGANCE" color="var(--pink)">
        Was zieh ich an?
      </SectionTitle>

      <div className="chunky bg-[#1a0838] p-4">
        <div className="flex gap-2" aria-live="polite">
          {REELS.map((items, reel) => (
            <Reel key={reel} items={items} index={indexes[reel]} spinning={spinning[reel]} />
          ))}
        </div>
        <p className="sr-only" aria-live="polite">
          {spun && !busy ? `Dein Outfit: ${REELS.map((r, i) => r[indexes[i]]).join(', ')}` : ''}
        </p>

        <button
          type="button"
          onClick={spin}
          disabled={busy}
          className="chunky font-display mt-4 flex min-h-14 w-full items-center justify-center gap-3 bg-[var(--cyan)] px-4 text-lg text-black disabled:opacity-80"
        >
          <Dices className={`h-6 w-6 ${busy ? 'animate-spin' : ''}`} strokeWidth={2.2} />
          {busy ? 'Rattert…' : spun ? 'Nochmal drehen!' : 'Dresscode Inspo'}
        </button>
      </div>

      <p className="alarm chunky font-display mt-5 px-4 py-3 text-center text-base leading-snug" role="note">
        ⚠ ACHTUNG: Arschkalt im Clubheim – zieht euch warm an! ⚠
      </p>
    </section>
  );
}

      <p className="font-display mt-3 text-2xl leading-tight text-white">Absage ist gespeichert.</p>
      <p className="font-body mt-3 text-lg font-bold text-white">
        Schade, {name}! Leopold weiß Bescheid – du musst ihm nicht extra schreiben.
      </p>
      <button
        type="button"
        onClick={onChange}
        className="font-body mt-4 min-h-12 text-sm text-white/60 underline underline-offset-4"
      >
        Kann doch? Antwort ändern
      </button>
    </motion.div>
  );
}

/* ───────────── RSVP + Easter Egg 4: Der Skifahrer-Angriff ─────────────────── */

function Skier({ onDone }) {
  return (
    <motion.span
      aria-hidden="true"
      className="pointer-events-none absolute top-1/2 z-10 -translate-y-1/2 text-4xl"
      initial={{ left: '104%' }}
      animate={{ left: '-16%', y: [0, -8, 0, -5, 0, -8, 0] }}
      transition={{ left: { duration: 1.5, ease: 'linear' }, y: { duration: 1.5 } }}
      onAnimationComplete={onDone}
      style={{ filter: 'drop-shadow(18px 0 0 rgba(255,255,255,.35)) drop-shadow(0 0 8px #00f0ff)' }}
    >
      ⛷️
    </motion.span>
  );
}

function readStoredRsvp() {
  const raw = storage.get(RSVP_STORAGE_KEY);
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    return parsed && parsed.name && parsed.status ? parsed : null;
  } catch {
    return null;
  }
}

function Rsvp({ onPhaseChange }) {
  const stored = useMemo(readStoredRsvp, []);
  // idle → confirming → confirmed   |   idle → declining → declined
  const [phase, setPhase] = useState(stored ? stored.status : 'idle');
  const [value, setValue] = useState('');
  const [guest, setGuest] = useState(stored?.name ?? '');
  const [savedAt, setSavedAt] = useState(stored?.at ?? null);
  const [error, setError] = useState('');
  const [skiers, setSkiers] = useState([]);
  const lastSkier = useRef(0);
  const shake = useAnimationControls();
  const busy = phase === 'confirming' || phase === 'declining';

  useEffect(() => {
    onPhaseChange?.(phase);
  }, [phase, onPhaseChange]);

  const handleType = (event) => {
    setValue(event.target.value);
    if (error) setError('');
    const now = Date.now();
    if (now - lastSkier.current > 2200 && Math.random() < 0.4) {
      lastSkier.current = now;
      setSkiers((list) => [...list, now]);
    }
  };

  const respond = async (status) => {
    if (busy) return;
    const key = value.trim().toLowerCase();
    if (!GUESTS.includes(key)) {
      setError(
        key
          ? 'Den Namen haben wir nicht auf der Liste. Tipp deinen Vornamen so, wie Leopold dich nennt.'
          : 'Erst deinen Vornamen eintippen!'
      );
      shake.start({ x: [0, -12, 10, -6, 4, 0], transition: { duration: 0.45 } });
      return;
    }

    const name = toDisplayName(key);
    setError('');
    setPhase(status === 'confirmed' ? 'confirming' : 'declining');
    try {
      await Promise.all([saveRsvp(name, status), wait(MIN_LOADING_MS)]);
      const at = new Date().toISOString();
      storage.set(RSVP_STORAGE_KEY, JSON.stringify({ name, status, at }));
      setGuest(name);
      setSavedAt(at);
      setPhase(status);
    } catch (err) {
      console.error('[RSVP]', err);
      setPhase('idle');
      setError(
        'Mist, die Verbindung hat gezickt – deine Antwort ist NICHT gespeichert. Bitte nochmal drücken.'
      );
    }
  };

  const reset = () => {
    storage.remove(RSVP_STORAGE_KEY);
    setValue(guest);
    setPhase('idle');
  };

  return (
    <section id="rsvp" className="scroll-mt-6 px-5 py-10">
      <SectionTitle kicker="RSVP · EIN KLICK REICHT" color="var(--cyan)">
        Bist du dabei?
      </SectionTitle>

      <AnimatePresence mode="wait" initial={false}>
        {phase === 'confirmed' ? (
          <Confirmed key="confirmed" name={guest} savedAt={savedAt} onChange={reset} />
        ) : phase === 'declined' ? (
          <Declined key="declined" name={guest} onChange={reset} />
        ) : (
          <motion.form
            key="form"
            className="chunky bg-[#1a0838] p-5"
            exit={{ opacity: 0, scale: 0.95, transition: { duration: 0.25 } }}
            onSubmit={(e) => {
              e.preventDefault();
              respond('confirmed');
            }}
            noValidate
          >
            <label htmlFor="guest-name" className="font-pixel block text-[10px] leading-relaxed text-white/80">
              DEIN VORNAME
            </label>

            <motion.div animate={shake} className="relative mt-3 overflow-hidden">
              <input
                id="guest-name"
                name="guest-name"
                type="text"
                value={value}
                onChange={handleType}
                disabled={busy}
                autoComplete="off"
                autoCorrect="off"
                autoCapitalize="words"
                spellCheck={false}
                enterKeyHint="send"
                placeholder="z. B. Cornelius"
                aria-invalid={Boolean(error)}
                aria-describedby={error ? 'rsvp-error' : undefined}
                className="font-display block h-16 w-full rounded-none border-[3px] border-black bg-white px-4 text-2xl text-black outline-none placeholder:text-black/25 focus:border-[var(--pink)] focus:shadow-[0_0_0_4px_var(--pink)]"
              />
              <AnimatePresence>
                {skiers.map((id) => (
                  <Skier key={id} onDone={() => setSkiers((list) => list.filter((s) => s !== id))} />
                ))}
              </AnimatePresence>
            </motion.div>

            <div aria-live="polite">
              {error && (
                <p
                  id="rsvp-error"
                  role="alert"
                  className="font-body mt-3 bg-[var(--pink)] px-3 py-2 text-sm font-bold text-white"
                >
                  {error}
                </p>
              )}
            </div>

            <button
              type="submit"
              disabled={busy}
              aria-busy={phase === 'confirming'}
              className="chunky font-display mt-5 flex min-h-16 w-full items-center justify-center gap-3 bg-[var(--pink)] px-4 text-xl text-white disabled:cursor-wait"
            >
              {phase === 'confirming' ? (
                <>
                  <Loader2 className="h-6 w-6 animate-spin" strokeWidth={2.5} />
                  Speichere…
                </>
              ) : (
                <>ICH BIN DABEI! 🎉</>
              )}
            </button>

            <button
              type="button"
              onClick={() => respond('declined')}
              disabled={busy}
              className="font-body mx-auto mt-3 flex min-h-12 items-center gap-2 px-4 text-sm text-white/65 underline underline-offset-4 disabled:opacity-50"
            >
              {phase === 'declining' ? (
                <>
                  <Loader2 className="h-4 w-4 animate-spin" /> Speichere Absage…
                </>
              ) : (
                'Kann leider nicht 😢'
              )}
            </button>
          </motion.form>
        )}
      </AnimatePresence>
    </section>
  );
}

/* ───────────────────────────── Floating RSVP CTA ─────────────────────────── */

function FloatingCta({ hidden }) {
  return (
    <AnimatePresence>
      {!hidden && (
        <motion.a
          href="#rsvp"
          className="chunky font-display fixed z-40 flex min-h-12 items-center gap-2 bg-[var(--yellow)] px-4 text-sm text-black"
          style={{
            right: '1rem',
            bottom: 'calc(env(safe-area-inset-bottom) + 1rem)',
          }}
          initial={{ y: 120, rotate: 8 }}
          animate={{ y: 0, rotate: -3 }}
          exit={{ y: 120 }}
          transition={{ type: 'spring', stiffness: 300, damping: 18 }}
        >
          Jetzt zusagen <ArrowRight className="h-4 w-4" strokeWidth={3} />
        </motion.a>
      )}
    </AnimatePresence>
  );
}

/* ──────────────────────────────── Geschenke ──────────────────────────────── */

function CopyIban() {
  const [copied, setCopied] = useState(false);

  useEffect(() => {
    if (!copied) return undefined;
    const timer = setTimeout(() => setCopied(false), 2200);
    return () => clearTimeout(timer);
  }, [copied]);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(IBAN.replace(/\s/g, ''));
      setCopied(true);
    } catch {
      // Clipboard unavailable (e.g. in-app browser) — the IBAN stays selectable.
    }
  };

  return (
    <button
      type="button"
      onClick={copy}
      className="chunky font-body mt-3 flex min-h-12 w-full items-center justify-between gap-3 bg-white px-3 py-2 text-left text-black"
    >
      <span className="select-text text-[15px] font-bold tabular-nums">{IBAN}</span>
      {copied ? (
        <Check className="h-5 w-5 shrink-0 text-green-600" strokeWidth={3} />
      ) : (
        <Copy className="h-5 w-5 shrink-0" strokeWidth={2.2} />
      )}
      <span className="sr-only" aria-live="polite">{copied ? 'IBAN kopiert' : ''}</span>
    </button>
  );
}

function Gifts() {
  return (
    <section className="px-5 py-8">
      <SectionTitle kicker="GESCHENKE?" color="var(--pink)">
        Nur wenn du magst
      </SectionTitle>
      <div className="chunky bg-[#1a0838] p-5">
        <p className="font-body text-base text-white/90">
          Dass du kommst, ist Geschenk genug. Wer trotzdem was geben will: eine Spende an den
          Tennisclub, der uns die Hütte leiht.
        </p>
        <p className="font-display mt-4 text-lg text-white">TC Kluftern</p>
        <CopyIban />
        <p className="font-body mt-3 text-sm text-white/80">Verwendungszweck: Spende</p>
        <p className="font-body mt-1 text-xs text-white/55">
          (Steuerlich absetzbar in deiner Steuererklärung 2026.)
        </p>
      </div>
    </section>
  );
}

/* ──────────────────────────────── Footer ─────────────────────────────────── */

/** In-app browsers (Instagram, WhatsApp…) can misbehave. On iOS 17+ the
 *  x-safari- scheme hands the current URL straight to Safari. */
function Footer() {
  const { href, isIOS } = useMemo(() => {
    const url = window.location.href;
    const ios =
      /iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    return { href: ios ? `x-safari-${url}` : url, isIOS: ios };
  }, []);

  return (
    <footer
      className="px-6 pb-24 pt-6 text-center"
      style={{ paddingBottom: 'calc(env(safe-area-inset-bottom) + 6rem)' }}
    >
      <p className="font-pixel text-[9px] leading-relaxed text-white/40">GAME OVER? NEVER. · 1996 – 2026</p>
      <a
        href={href}
        {...(!isIOS && { target: '_blank', rel: 'noopener noreferrer' })}
        className="font-body mt-2 inline-flex min-h-12 items-center text-xs text-white/50 underline underline-offset-4"
      >
        Probleme? Hier tippen, um die Seite in Safari zu öffnen.
      </a>
    </footer>
  );
}

/* ───────────────────────────────── App ───────────────────────────────────── */

const POLAROIDS_TOP = [
  { src: './leo-1.jpg', caption: 'Beweisfoto #1', rotate: -7 },
  { src: './leo-2.jpg', caption: 'Pistensau, ca. 1999', rotate: 6 },
];
const POLAROIDS_BOTTOM = [
  { src: './leo-3.jpg', caption: 'Après-Ski-Profi', rotate: 5 },
  { src: './leo-4.jpg', caption: 'Bald: 30 & fabelhaft', rotate: -6 },
];

function App() {
  const reduceMotion = useReducedMotion();
  const [showIntro, setShowIntro] = useState(
    () => !reduceMotion && storage.sessionGet(INTRO_STORAGE_KEY) !== '1'
  );

  const endIntro = useCallback(() => {
    storage.sessionSet(INTRO_STORAGE_KEY, '1');
    setShowIntro(false);
  }, []);

  return (
    <MotionConfig reducedMotion="user">
      <div className="font-body relative min-h-[100dvh] overflow-x-clip bg-[#0d0221] text-white antialiased selection:bg-[var(--pink)] selection:text-white">
        <Backdrop />
        <Snow />

        <AnimatePresence>{showIntro && <Intro key="intro" onDone={endIntro} />}</AnimatePresence>

        {!showIntro && <Page />}
      </div>
    </MotionConfig>
  );
}

// Mounted only after the intro, so the in-view observer attaches to a real element.
function Page() {
  const rsvpRef = useRef(null);
  const rsvpInView = useInView(rsvpRef);
  const [rsvpPhase, setRsvpPhase] = useState('idle');
  const answered = rsvpPhase === 'confirmed' || rsvpPhase === 'declined';

  return (
          <motion.div
            className="relative z-10"
            initial={{ opacity: 0, y: 30 }}
            animate={{ opacity: 1, y: 0 }}
            transition={{ duration: 0.5 }}
          >
            <Marquee />
            <main className="mx-auto w-full max-w-lg">
              <Hero />
              <Facts />
              <PolaroidPair items={POLAROIDS_TOP} />
              <FrostScratch />
              <OutfitSlot />
              <PolaroidPair items={POLAROIDS_BOTTOM} />
              <PubQuiz />
              <div ref={rsvpRef}>
                <Rsvp onPhaseChange={setRsvpPhase} />
              </div>
              <Gifts />
              <Footer />
            </main>
            <FloatingCta hidden={answered || rsvpInView} />
          </motion.div>
  );
}

/* ──────────────────────────────── Mount ──────────────────────────────────── */

createRoot(document.getElementById('root')).render(<App />);
  </script>
